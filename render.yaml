services:
  - type: web
    name: hospital-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_ACCOUNT_SID
        value: shmtechnologies2
      - key: EXOTEL_PHONE_NUMBER
        value: 095-138-86363
      - key: EXOTEL_API_BASE_URL
        value: https://api.exotel.com
      - key: ENVIRONMENT
        value: production
